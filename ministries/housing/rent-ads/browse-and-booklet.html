<!DOCTYPE html>
<html lang="ar" dir="rtl" class="presentation">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعراض الإعلانات وشراء كراسة الشروط — دليل مصر الرقمية</title>
<link rel="stylesheet" href="../../../assets/style.css">
<link rel="stylesheet" href="../../../assets/ads.css">
</head>
<body>

<header class="topbar site-header" data-variant="service" data-prefix="../../../" data-subtitle="استعراض الإعلانات وشراء كراسة الشروط"></header>

<nav class="rail" id="rail"></nav>
<button class="down-hint" id="downHint">
  <span>التالي</span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
</button>

<div class="deck" id="deck">

  <!-- قائمة الإعلانات فقط — الاختيار منها يفتح صفحة الإعلان وبياناته -->
  <section class="slide slide-desc">
    <div class="content" style="max-width:980px;">
      <span class="num-tag reveal">الإسكان الاجتماعي ودعم التمويل العقاري</span>
      <h2 class="reveal">اختر الإعلان الذي تريد الاطلاع عليه</h2>
      <p class="reveal">اختر الإعلان لتنتقل إلى بياناته (المواعيد والوحدات والدخل) وخطوات شراء كراسة الشروط الخاصة به.</p>
      <div class="ads-list reveal" id="adsList" data-service="booklet"></div>
    </div>
  </section>

</div>

<script src="../../../assets/theme.js"></script>
<script src="../../../assets/partials.js"></script>
<script src="../../../assets/ads-data.js"></script>
